<!DOCTYPE html>
<html>
<head>
  <title>Ambient Particle Universe — OVERRIDE</title>
  <style>
    html,body{
      margin:0;
      padding:0;
      overflow:hidden;
      background:#000;
    }
    #info{
      position:fixed;
      left:20px;
      top:20px;
      color:#fff;
      font-family:Arial;
      background:rgba(0,0,0,0.4);
      padding:10px;
      border-radius:8px;
      backdrop-filter:blur(6px);
    }
  </style>
</head>
<body>

<canvas id="u"></canvas>
<div id="info">
  OVERRIDE MODE — Particle Universe<br>
  Click = Shockwave • Hold = Singularity • SPACE = CHAOS STACK
</div>

<script>
(function(){

  const canvas = document.getElementById("u");
  const ctx = canvas.getContext("2d");

  const S = {
    w: innerWidth,
    h: innerHeight,
    particles: [],
    mouse: { x:null, y:null, down:false },
    time: 0,
    chaos: 0,
    bgShift: 0,
    maxParticles: 10000
  };

  canvas.width = S.w;
  canvas.height = S.h;

  // Resize
  window.addEventListener("resize", () => {
    S.w = innerWidth;
    S.h = innerHeight;
    canvas.width = S.w;
    canvas.height = S.h;
  });

  // Mouse
  window.addEventListener("mousemove", e => {
    S.mouse.x = e.clientX;
    S.mouse.y = e.clientY;
  });

  window.addEventListener("mousedown", () => {
    S.mouse.down = true;
    shockwave(S.mouse.x, S.mouse.y, 1);
  });

  window.addEventListener("mouseup", () => {
    S.mouse.down = false;
  });

  // Keyboard
  window.addEventListener("keydown", e => {
    if(e.code === "Space"){
      S.chaos += 0.4;
      shockwave(S.w/2, S.h/2, 2);
    }
  });

  // Spawn particle
  function spawn(x, y, intense){
    const angle = Math.random() * Math.PI * 2;
    const speed = intense ? 4 + Math.random()*8 : 0.4 + Math.random()*1.2;
    const hue = (S.time * 50 + Math.random()*200) % 360;
    const size = intense ? 2 + Math.random()*6 : 0.5 + Math.random()*2;
    const life = 300 + Math.random()*600;

    S.particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      ax: 0,
      ay: 0.01 + Math.random()*0.03,
      size: size,
      hue: hue,
      life: life,
      age: 0,
      spin: (Math.random()-0.5)*0.2,
      wobble: Math.random()*Math.PI*2,
      wobbleSpeed: 0.02 + Math.random()*0.04,
      glow: Math.random() < 0.8,
      split: Math.random() < 0.03
    });
  }

  // Shockwave burst
  function shockwave(x, y, power){
    for(let i=0; i<400*power; i++){
      spawn(
        x + (Math.random()-0.5)*80,
        y + (Math.random()-0.5)*80,
        true
      );
    }
  }

  // Initial seed
  (function seed(){
    for(let i=0; i<2000; i++){
      spawn(Math.random()*S.w, Math.random()*S.h, false);
    }
  })();

  // Main loop
  function loop(){
    requestAnimationFrame(loop);

    S.time += 0.01;
    S.bgShift = Math.sin(S.time*0.3)*0.5 + 0.5;

    // Background
    ctx.fillStyle = `rgba(0,0,0,${0.2 + S.bgShift*0.2})`;
    ctx.fillRect(0,0,S.w,S.h);

    // Ambient spawning
    if(S.particles.length < S.maxParticles){
      for(let i=0; i<20; i++){
        spawn(Math.random()*S.w, Math.random()*S.h, false);
      }
    }

    S.chaos *= 0.99;

    const mx = S.mouse.x;
    const my = S.mouse.y;
    const hasMouse = mx !== null;

    // Update particles
    for(let i=S.particles.length-1; i>=0; i--){
      const p = S.particles[i];

      // Wobble
      p.wobble += p.wobbleSpeed;
      const wobbleForce = Math.sin(p.wobble) * 0.1;

      // Mouse gravity
      if(hasMouse){
        const dx = mx - p.x;
        const dy = my - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const force = S.mouse.down
          ? 0.3 + S.chaos*0.4
          : 0.02 + S.chaos*0.05;

        p.ax += nx * force;
        p.ay += ny * force;
      }

      // Physics
      p.vx += wobbleForce;
      p.vy += wobbleForce * 0.3;

      p.ay += 0.002 + S.chaos*0.004;

      p.vx *= 0.995;
      p.vy *= 0.995;

      p.vx += p.ax;
      p.vy += p.ay;

      p.x += p.vx;
      p.y += p.vy;

      p.age++;
      const lifeRatio = p.age / p.life;

      p.size *= 0.999;
      const alpha = Math.max(0, 1 - lifeRatio*1.4);

      // Recursive splitting
      if(p.split && Math.random() < 0.01){
        spawn(p.x, p.y, true);
      }

      // Wrap
      if(p.x < -50) p.x = S.w + 50;
      if(p.x > S.w + 50) p.x = -50;
      if(p.y < -50) p.y = S.h + 50;
      if(p.y > S.h + 50) p.y = -50;

      // Draw
      const grad = ctx.createRadialGradient(
        p.x, p.y, 0,
        p.x, p.y, p.size*8
      );

      const baseHue = p.hue + Math.sin(S.time*1.2 + p.spin*50)*60;

      grad.addColorStop(0, `hsla(${baseHue},80%,70%,${alpha})`);
      grad.addColorStop(0.4, `hsla(${baseHue+20},70%,50%,${alpha*0.8})`);
      grad.addColorStop(1, `hsla(${baseHue+40},60%,40%,0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*8, 0, Math.PI*2);
      ctx.fill();

      // Trails
      if(alpha > 0.2){
        ctx.strokeStyle = `hsla(${baseHue},80%,70%,${alpha*0.4})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(p.x - p.vx*6, p.y - p.vy*6);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      // Kill
      if(lifeRatio >= 1.4 || p.size < 0.2){
        S.particles.splice(i,1);
      }

      p.ax = 0;
      p.ay = 0;
    }

    // Random cosmic events
    if(Math.random() < 0.003){
      shockwave(Math.random()*S.w, Math.random()*S.h, Math.random()*3);
    }

  }

  loop();

})();
</script>

</body>
</html>
